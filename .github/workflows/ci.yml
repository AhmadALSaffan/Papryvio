name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Frontend (typecheck, tests, build)
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Fetch PDFium
        run: npm run setup:pdfium

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
