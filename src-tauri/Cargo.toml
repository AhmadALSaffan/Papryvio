[package]
name = "papryvio"
version = "0.1.0"
description = "Papryvio — local research assistant for your PDF papers"
edition = "2021"
rust-version = "1.94"
default-run = "papryvio"

[lib]
name = "papryvio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = "0.10"
hex = "0.4"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_8125", "thread_safe"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
base64 = "0.22"
github-copilot-sdk = "=1.0.29"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "unwind"
